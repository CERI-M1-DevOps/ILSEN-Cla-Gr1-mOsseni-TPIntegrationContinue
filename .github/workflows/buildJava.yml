name: Java CI with Maven - Test and package

on:
    pull_request:
        branches: [main]

jobs:
    java-ci-with-maven:
        name: Java CI with Maven
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4
            - uses: actions/setup-java@v4
              with:
                  java-version: '21'
                  distribution: 'corretto'
